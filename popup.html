<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusGate Kids</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #09090b;
      color: #fafafa;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: center;
    }
    .status-text {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .status-sub {
      font-size: 12px;
      color: #a1a1aa;
    }
    .pin-section {
      background: #121215;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      background: #09090b;
      border: 1px solid #3f3f46;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.1em;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    .btn-primary { background: #6366f1; color: white; margin-bottom: 6px; }
    .btn-secondary { background: #27272a; color: #e4e4e7; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛡️ FocusGate Kids</div>
    <span id="badgeState" style="font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #6366f122; color: #818cf8;">PROTECTED</span>
  </div>

  <div class="status-card">
    <div class="status-text" id="statusHeading">Anti-Brainrot Active</div>
    <div class="status-sub" id="statusDetails">Short videos & social feeds blocked</div>
  </div>

  <div class="pin-section">
    <div style="font-size: 12px; color: #a1a1aa; margin-bottom: 6px; text-align: center;">Parent Lock: Enter PIN for 15-min pass</div>
    <input type="password" id="parentPinInput" placeholder="Parent PIN" maxlength="6" />
    <button class="btn-primary" id="btnUnlockPass">Grant 15-Min Allowance</button>
    <div id="pinResult" style="font-size: 11px; text-align: center; margin-top: 4px;"></div>
  </div>

  <button class="btn-secondary" id="btnOpenDashboard">⚙️ Open Full Parent Dashboard</button>

  <div style="margin:10px 0 0;display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;color:#94a3b8;">
    <span>Language</span>
    <select id="popupLanguageSelect" style="background:#111827;color:#e5e7eb;border:1px solid #334155;border-radius:6px;padding:4px 6px;font-size:11px;">
      <option value="en">English</option><option value="fr">Français</option>
    </select>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
